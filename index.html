<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ქალაქობანა</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f8fbff;
    --grid: #d3e3f4;
    --ink: #1f3a93;
    --ink-soft: #5d73b8;
    --margin: #d9534f;
    --good: #1c7c4d;
    --shared: #ffe27a;
    --muted: #8a94a8;
    --line: #9db4dc;
    --font: "Noto Sans Georgian", "Sylfaen", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    min-height: 100vh;
    line-height: 1.5;
  }
  /* რვეულის წითელი ველი */
  body::before {
    content: "";
    position: fixed; top: 0; bottom: 0; left: 44px; width: 2px;
    background: var(--margin); opacity: .55; pointer-events: none;
  }
  main { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px 72px; }
  @media (max-width: 560px) {
    body::before { left: 12px; }
    main { padding: 20px 14px 50px 28px; }
  }
  h1 { font-size: 2.4rem; font-weight: 800; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 1.25rem; font-weight: 600; margin: 0 0 12px; }
  p { margin: 0 0 12px; }
  .sub { color: var(--ink-soft); }
  .sheet {
    background: rgba(255,255,255,.88);
    border: 1.5px solid var(--line);
    padding: 18px 20px;
    margin: 18px 0;
  }
  label.f { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type=text], input[type=number] {
    font: inherit; color: var(--ink);
    background: transparent;
    border: none; border-bottom: 2px solid var(--line);
    padding: 6px 2px; width: 100%;
    border-radius: 0;
  }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 2px;
  }
  input[type=text]:focus { border-bottom-color: var(--ink); }
  input[readonly] { color: var(--ink-soft); }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    color: #fff; background: var(--ink);
    border: 2px solid var(--ink); padding: 10px 18px;
    border-radius: 3px;
  }
  button.ghost { background: transparent; color: var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .row > * { flex: 1 1 160px; }
  .row > button { flex: 0 0 auto; }
  .err { color: var(--margin); min-height: 1.5em; font-weight: 600; }

  /* ლობი */
  .code {
    font-size: 2.6rem; font-weight: 800; letter-spacing: .25em;
    border: 2px dashed var(--ink); display: inline-block; padding: 2px 16px 2px 22px;
  }
  .players { list-style: none; margin: 0; padding: 0; }
  .players li {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 6px 2px; border-bottom: 1px solid var(--grid);
  }
  .players .off { color: var(--muted); }
  .tag { font-size: .8rem; color: var(--ink-soft); margin-left: 6px; }

  /* რაუნდი */
  .roundbar { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
  .bigletter {
    font-size: clamp(110px, 26vw, 190px); font-weight: 800; line-height: 1;
    display: inline-block; transform: rotate(-3deg);
    background: linear-gradient(transparent 62%, var(--shared) 62%, var(--shared) 90%, transparent 90%);
    padding: 0 12px; margin: 6px 0 10px;
  }
  .cat { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: end; margin-bottom: 8px; }
  @media (max-width: 560px) { .cat { grid-template-columns: 1fr; gap: 0; } }
  .cat span { color: var(--ink-soft); font-weight: 600; padding-bottom: 6px; }
  .cat.bad input { border-bottom-color: var(--margin); }

  .stopwrap { margin-top: 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .stamp {
    background: transparent; color: var(--margin);
    border: 4px double var(--margin); border-radius: 6px;
    font-size: 1.9rem; font-weight: 800; letter-spacing: .08em;
    padding: 6px 26px; transform: rotate(-3deg);
  }
  .stamp:disabled { opacity: .35; }
  .stamp:not(:disabled):hover { background: var(--margin); color: #fff; }
  .hint { color: var(--ink-soft); }

  .countdown {
    margin-top: 16px; padding: 12px 14px; border: 2px solid var(--margin);
    color: var(--margin); font-weight: 600;
  }
  .countdown .bar { height: 6px; background: var(--grid); margin-top: 8px; }
  .countdown .bar i { display: block; height: 100%; background: var(--margin); width: 100%; }
  .time { font-size: 1.6rem; font-weight: 800; }

  /* შედეგები */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: rgba(255,255,255,.9); }
  th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; font-size: .95rem; }
  th { font-weight: 600; background: #eef4fc; }
  td.unique .pts { color: var(--good); font-weight: 800; }
  td.shared { background: var(--shared); }
  td.shared .pts { font-weight: 800; }
  td.invalid .txt, td.empty .txt { text-decoration: line-through; color: var(--muted); }
  td.invalid .pts, td.empty .pts { color: var(--muted); }
  .pts { margin-left: 6px; font-size: .85rem; }
  td.total, th.total { font-weight: 800; text-align: right; white-space: nowrap; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-soft); margin-top: 8px; }
  .legend b { padding: 0 6px; border: 1px solid var(--line); }
  .legend .s { background: var(--shared); }

  .rank { list-style: none; padding: 0; margin: 0 0 16px; counter-reset: r; }
  .rank li { display: flex; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid var(--line); font-size: 1.15rem; }
  .rank li:first-child { font-weight: 800; font-size: 1.5rem; }
  .rank li::before { counter-increment: r; content: counter(r) "."; width: 2rem; color: var(--ink-soft); }
  .rank li span:first-of-type { flex: 1; }

  /* კატეგორიები და გასაჩივრება */
  .catedit { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 6px; }
  .catedit button.x { padding: 4px 12px; font-size: 1.2rem; line-height: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); padding: 2px 12px; background: #fff; }
  td.rejected { background: #fde4e3; }
  td.rejected .txt { text-decoration: line-through; color: var(--margin); }
  td.rejected .pts { color: var(--margin); }
  .chal {
    background: transparent; color: var(--ink-soft); border: 1px solid var(--line);
    padding: 0 6px; margin-left: 6px; font-size: .8rem; line-height: 1.5; border-radius: 3px;
  }
  .chal.on { background: var(--margin); border-color: var(--margin); color: #fff; }
  .chcount { font-size: .75rem; color: var(--margin); margin-left: 4px; font-weight: 600; }
  .legend .r { background: #fde4e3; }

  .hidden { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main id="app"></main>

<script>
(() => {
  const app = document.getElementById('app');
  const $ = (s, r = app) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  let session = null;       // { room, pid }
  let state = null;         // სერვერის უახლესი მდგომარეობა
  let es = null;            // EventSource
  let clockOffset = 0;      // serverNow - Date.now()
  let screenKey = '';       // რომელი ეკრანია ახლა დახატული
  let drafts = [];          // მიმდინარე რაუნდის პასუხები
  let submittedRound = -1;  // რომელი რაუნდის პასუხები გავაგზავნეთ
  let tickTimer = null;
  let cfgCats = null;       // მასპინძლის მიერ რედაქტირებადი კატეგორიები
  let cfgTimer = null;
  let lobbyHost = null;

  const saved = sessionStorage.getItem('qalaqobana');
  if (saved) { try { session = JSON.parse(saved); } catch {} }

  async function api(path, body) {
    try {
      const r = await fetch('/api/' + path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...body, room: session?.room, pid: session?.pid }),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'შეცდომა');
      return data;
    } catch (e) {
      if (e instanceof TypeError) throw new Error('სერვერთან კავშირი ვერ დამყარდა');
      throw e;
    }
  }

  function connect() {
    if (es) es.close();
    es = new EventSource(`/api/events?room=${encodeURIComponent(session.room)}&pid=${encodeURIComponent(session.pid)}`);
    es.onmessage = (ev) => {
      state = JSON.parse(ev.data);
      clockOffset = state.serverNow - Date.now();
      render();
    };
    es.onerror = () => {
      // 404 → EventSource CLOSED: ოთახი ან მოთამაშე აღარ არსებობს
      if (es.readyState === EventSource.CLOSED) leave('ოთახი აღარ არსებობს');
    };
  }

  function leave(msg) {
    if (es) es.close();
    es = null; session = null; state = null; screenKey = ''; cfgCats = null; lobbyHost = null;
    sessionStorage.removeItem('qalaqobana');
    history.replaceState(null, '', location.pathname);
    renderHome(msg || '');
  }

  const serverNow = () => Date.now() + clockOffset;
  const me = () => state.players.find((p) => p.id === session.pid);
  const isHost = () => state.host === session.pid;

  // ---------- მთავარი ეკრანი ----------
  function renderHome(msg = '') {
    screenKey = 'home';
    const preset = new URLSearchParams(location.search).get('room') || '';
    app.innerHTML = `
      <h1>ქალაქობანა</h1>
      <p class="sub">ასო, ექვსი გრაფა და „სტოპი“ — ვინ უფრო სწრაფი და გამომგონებელია?</p>
      <div class="sheet">
        <label class="f" for="name">შენი სახელი</label>
        <input type="text" id="name" maxlength="16" autocomplete="nickname" value="${esc(localStorage.getItem('qq-name') || '')}">
      </div>
      <div class="sheet">
        <button id="play">${preset ? 'შესვლა მეგობრის ოთახში' : 'თამაში'}</button>
      </div>
      ${preset ? '' : `<div class="sheet">
        <h2>მეგობრებთან ერთად</h2>
        <p class="hint">შექმენი დახურული ოთახი და გაუგზავნე მეგობრებს ბმული.</p>
        <button id="create" class="ghost">დახურული ოთახის შექმნა</button>
      </div>`}
      <p class="err" id="err">${esc(msg)}</p>
      <details class="sheet"><summary><b>თამაშის წესები</b></summary>
        <p style="margin-top:10px">თითო რაუნდზე დაიძახება ერთი ასო. თითოეულმა მოთამაშემ უნდა შეავსოს ექვსივე გრაფა სიტყვით, რომელიც ამ ასოზე იწყება.</p>
        <p>ვინც პირველი შეავსებს, აჭერს „სტოპს“ — დანარჩენებს რჩებათ 10 წამი დასასრულებლად.</p>
        <p>ქულები: უნიკალური სიტყვა — <b>10</b>, სხვასაც იგივე რომ დაუწერია — <b>5</b>, ცარიელი ან არასწორ ასოზე დაწყებული — <b>0</b>.</p>
      </details>`;
    const nameEl = $('#name');
    const err = (m) => { $('#err').textContent = m; };
    const nm = () => {
      const v = nameEl.value.trim();
      if (!v) { err('ჯერ სახელი ჩაწერე'); nameEl.focus(); return null; }
      localStorage.setItem('qq-name', v);
      return v;
    };
    $('#play').onclick = async () => {
      const name = nm(); if (!name) return;
      try {
        session = preset ? await api('join', { name, room: preset.toUpperCase() }) : await api('quick', { name });
        start();
      } catch (e) { err(e.message); }
    };
    const cr = $('#create');
    if (cr) cr.onclick = async () => {
      const name = nm(); if (!name) return;
      try { session = await api('create', { name, private: true }); start(); } catch (e) { err(e.message); }
    };
  }

  function start() {
    sessionStorage.setItem('qalaqobana', JSON.stringify(session));
    history.replaceState(null, '', '?room=' + session.room);
    connect();
  }

  // ---------- რენდერი ----------
  function render() {
    if (!state) return;
    clearInterval(tickTimer);
    const ph = state.phase;
    if (ph === 'lobby') return renderLobby();
    if (ph === 'playing' || ph === 'countdown') return renderPlay();
    if (ph === 'collecting') return renderCollecting();
    if (ph === 'results' || ph === 'finished') return renderResults();
  }

  function playersList() {
    return `<ul class="players">${state.players.map((p) => `
      <li class="${p.connected ? '' : 'off'}">
        <span>${esc(p.name)}${p.id === state.host ? '<span class="tag">მასპინძელი</span>' : ''}${p.id === session.pid ? '<span class="tag">შენ</span>' : ''}${p.connected ? '' : '<span class="tag">გამოსულია</span>'}</span>
        <span>${p.score}</span>
      </li>`).join('')}</ul>`;
  }

  function pushCfg() {
    clearTimeout(cfgTimer);
    cfgTimer = setTimeout(() => { api('config', { categories: cfgCats }).catch(() => {}); }, 300);
  }

  function catEditorHtml() {
    return `<div class="cats" id="cats">${cfgCats.map((c, i) => `
      <div class="catedit">
        <input type="text" maxlength="24" value="${esc(c)}" data-i="${i}" aria-label="კატეგორია ${i + 1}" placeholder="კატეგორიის სახელი">
        ${cfgCats.length > 1 ? `<button type="button" class="ghost x" data-del="${i}" aria-label="წაშლა">×</button>` : ''}
      </div>`).join('')}
      ${cfgCats.length < 12 ? '<button type="button" class="ghost" id="addcat">+ კატეგორიის დამატება</button>' : ''}
    </div>`;
  }

  function bindCatEditor() {
    const box = $('#cats'); if (!box) return;
    const redraw = () => { box.outerHTML = catEditorHtml(); bindCatEditor(); pushCfg(); };
    box.querySelectorAll('input').forEach((inp) => inp.addEventListener('input', () => { cfgCats[+inp.dataset.i] = inp.value; pushCfg(); }));
    box.querySelectorAll('[data-del]').forEach((b) => { b.onclick = () => { cfgCats.splice(+b.dataset.del, 1); redraw(); }; });
    const add = $('#addcat');
    if (add) add.onclick = () => { cfgCats.push(''); redraw(); const ins = $('#cats').querySelectorAll('input'); ins[ins.length - 1].focus(); };
  }

  const chips = () => state.categories.map((c) => `<span class="chip">${esc(c)}</span>`).join('');
  const cleanCfg = () => (cfgCats || []).map((c) => c.trim()).filter(Boolean);

  function renderLobby() {
    const host = isHost();
    if (host && !cfgCats) cfgCats = [...state.categories];
    if (screenKey === 'lobby' && lobbyHost === host) {
      // ვანახლებთ მხოლოდ სიას, რომ მასპინძლის ჩაწერილი ტექსტი არ დაიკარგოს
      $('#plist').innerHTML = `<h2>მოთამაშეები (${state.players.length})</h2>${playersList()}`;
      const cv = $('#catview'); if (cv) cv.innerHTML = chips();
      return;
    }
    lobbyHost = host;
    screenKey = 'lobby';
    const link = location.origin + '/?room=' + state.code;
    app.innerHTML = `
      <h1>ქალაქობანა</h1>
      <p class="sub">${state.isPrivate ? 'გაუგზავნე მეგობრებს ეს ბმული:' : 'ველოდებით სხვა მოთამაშეებს ან გაუგზავნე მეგობრებს ბმული:'}</p>
      <p><button class="ghost" id="copy">ბმულის კოპირება</button> <span class="hint" id="copied"></span></p>
      <div class="sheet" id="plist"><h2>მოთამაშეები (${state.players.length})</h2>${playersList()}</div>
      <div class="sheet"><h2>კატეგორიები</h2>
        ${host ? catEditorHtml() : `<div class="chips" id="catview">${chips()}</div>`}
      </div>
      ${host ? `
        <div class="sheet row">
          <div><label class="f" for="rounds">რაუნდების რაოდენობა</label>
          <input type="number" id="rounds" min="1" max="15" value="5"></div>
          <button id="go">თამაშის დაწყება</button>
        </div>` : `<p class="hint">ველოდებით მასპინძელს, სანამ თამაშს დაიწყებს…</p>`}
      <p class="err" id="err"></p>
      <p><button class="ghost" id="leave">გასვლა</button></p>`;
    $('#copy').onclick = async () => {
      try { await navigator.clipboard.writeText(link); $('#copied').textContent = 'დაკოპირდა'; }
      catch { $('#copied').textContent = link; }
    };
    $('#leave').onclick = () => leave();
    if (host) bindCatEditor();
    const go = $('#go');
    if (go) go.onclick = async () => {
      try { await api('start', { rounds: $('#rounds').value, categories: cleanCfg() }); } catch (e) { $('#err').textContent = e.message; }
    };
  }

  function renderPlay() {
    const key = 'play:' + state.round;
    if (screenKey !== key) {
      screenKey = key;
      drafts = state.categories.map(() => '');
      submittedRound = -1;
      app.innerHTML = `
        <div class="roundbar">
          <h2>რაუნდი ${state.round} / ${state.totalRounds}</h2>
          <span class="sub" id="who"></span>
        </div>
        <div class="bigletter" aria-label="ასო ${esc(state.letter)}">${esc(state.letter)}</div>
        <div class="sheet" id="fields">
          ${state.categories.map((c, i) => `
            <div class="cat" data-i="${i}">
              <span>${esc(c)}</span>
              <input type="text" maxlength="40" autocomplete="off" aria-label="${esc(c)}" data-i="${i}">
            </div>`).join('')}
        </div>
        <div id="cd" class="countdown hidden"></div>
        <div class="stopwrap">
          <button class="stamp" id="stop" disabled>სტოპ</button>
          <span class="hint" id="hint">შეავსე ყველა გრაფა, რომ „სტოპის“ დაჭერა შეგეძლოს</span>
        </div>
        <p class="err" id="err"></p>`;
      const inputs = [...app.querySelectorAll('#fields input')];
      inputs.forEach((inp) => {
        inp.addEventListener('input', () => { drafts[+inp.dataset.i] = inp.value; refreshStop(); });
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const next = inputs[+inp.dataset.i + 1];
            if (next) next.focus(); else if (!$('#stop').disabled) $('#stop').click();
          }
        });
      });
      inputs[0].focus();
      $('#stop').onclick = async () => {
        $('#stop').disabled = true;
        try { await api('stop', { answers: drafts }); }
        catch (e) { $('#err').textContent = e.message; refreshStop(); }
      };
    }

    refreshStop();
    updatePlayDynamic();
    tickTimer = setInterval(updatePlayDynamic, 100);
  }

  function refreshStop() {
    const stop = $('#stop'); if (!stop) return;
    const filled = drafts.length && drafts.every((d) => d.trim().length > 0);
    stop.disabled = !(state.phase === 'playing' && filled);
    $('#hint').classList.toggle('hidden', state.phase !== 'playing');
    // ხაზგასმა გრაფებზე, რომლებიც არასწორ ასოზე იწყება (მხოლოდ მინიშნება, არა ბლოკი)
    app.querySelectorAll('#fields .cat').forEach((row) => {
      const v = (drafts[+row.dataset.i] || '').trim().toLowerCase();
      row.classList.toggle('bad', v.length > 0 && v[0] !== state.letter);
    });
  }

  function updatePlayDynamic() {
    if (!state || !$('#cd')) return;
    const cd = $('#cd');
    const inputs = app.querySelectorAll('#fields input');
    if (state.phase === 'countdown') {
      const stopper = state.players.find((p) => p.id === state.stopper);
      const left = Math.max(0, state.endsAt - serverNow());
      const total = 10000;
      cd.classList.remove('hidden');
      cd.innerHTML = `<div>${stopper && stopper.id === session.pid ? 'შენ დააჭირე სტოპს!' : esc(stopper ? stopper.name : 'ვიღაცამ') + ' დააჭირა სტოპს!'} დაასრულე სწრაფად:</div>
        <div class="time">${Math.ceil(left / 1000)}</div>
        <div class="bar"><i style="width:${Math.min(100, (left / total) * 100)}%"></i></div>`;
      if (state.stopper === session.pid) inputs.forEach((i) => (i.readOnly = true));
    } else {
      cd.classList.add('hidden');
    }
    refreshStop();
  }

  function renderCollecting() {
    // ავტომატურად გავგზავნოთ ჩვენი პასუხები (ერთხელ თითო რაუნდზე)
    if (submittedRound !== state.round) {
      submittedRound = state.round;
      api('submit', { answers: drafts }).catch(() => {});
    }
    screenKey = 'collecting';
    app.innerHTML = `
      <h2>რაუნდი ${state.round} / ${state.totalRounds}</h2>
      <div class="bigletter" style="font-size:90px">${esc(state.letter)}</div>
      <p class="sub">ვითვლით ქულებს…</p>`;
  }

  function renderResults() {
    const r = state.results; if (!r) return;
    const fin = state.phase === 'finished';
    screenKey = 'results:' + state.round + ':' + state.phase;
    const cats = state.categories;
    const rows = r.rows;
    const ranking = [...rows].sort((a, b) => b.score - a.score);
    const keepRounds = $('#rounds')?.value;
    const sy = window.scrollY;
    if (fin && isHost() && !cfgCats) cfgCats = [...state.categories];

    app.innerHTML = `
      <div class="roundbar"><h2>რაუნდი ${state.round} / ${state.totalRounds} — ასო „${esc(r.letter)}“</h2></div>
      <div class="tablewrap"><table>
        <thead><tr><th>მოთამაშე</th>${cats.map((c) => `<th>${esc(c)}</th>`).join('')}<th class="total">რაუნდი</th><th class="total">სულ</th></tr></thead>
        <tbody>${rows.map((row) => `<tr>
          <th>${esc(row.name)}${row.id === session.pid ? '<span class="tag">შენ</span>' : ''}</th>
          ${row.cells.map((c, ci) => {
            const mine = c.ch.includes(session.pid);
            const btn = row.id !== session.pid && c.canCh
              ? `<button type="button" class="chal ${mine ? 'on' : ''}" data-ch data-t="${row.id}" data-c="${ci}" aria-pressed="${mine}" aria-label="გასაჩივრება" title="${mine ? 'გასაჩივრების გაუქმება' : 'გასაჩივრება'}">⚑</button>` : '';
            const cnt = c.ch.length ? `<span class="chcount">${c.ch.length}/${c.need}</span>` : '';
            return `<td class="${c.status}"><span class="txt">${esc(c.text) || '—'}</span><span class="pts">+${c.pts}</span>${btn}${cnt}</td>`;
          }).join('')}
          <td class="total">+${row.total}</td><td class="total">${row.score}</td></tr>`).join('')}
        </tbody></table></div>
      <div class="legend">
        <span><b>+10</b> უნიკალური</span><span><b class="s">+5</b> განმეორებული</span><span><b>+0</b> ცარიელი ან არასწორი ასო</span><span><b class="r">+0</b> გასაჩივრებული</span>
      </div>
      <p class="hint" style="margin-top:10px">პასუხი არასწორია? დააჭირე ⚑-ს. თუ ყველა დანარჩენი მოთამაშე გაასაჩივრებს, პასუხი არ ჩაითვლება.</p>
      ${fin ? `
        <div class="sheet" style="margin-top:22px">
          <h2>საბოლოო შედეგი</h2>
          <ol class="rank">${ranking.map((p) => `<li><span>${esc(p.name)}</span><span>${p.score}</span></li>`).join('')}</ol>
          ${isHost() ? `<h2>კატეგორიები</h2>${catEditorHtml()}<div class="row" style="margin-top:12px"><div><label class="f" for="rounds">რაუნდების რაოდენობა</label><input type="number" id="rounds" min="1" max="15" value="${state.totalRounds}"></div><button id="again">ახალი თამაში</button></div>`
            : '<p class="hint">ველოდებით მასპინძელს ახალი თამაშისთვის…</p>'}
        </div>` : `
        <div class="stopwrap">
          ${isHost() ? '<button id="next">შემდეგი რაუნდი</button>' : '<span class="hint">ველოდებით მასპინძელს შემდეგი რაუნდისთვის…</span>'}
        </div>`}
      <p class="err" id="err"></p>
      <p><button class="ghost" id="leave">გასვლა</button></p>`;

    $('#leave').onclick = () => leave();
    if (keepRounds && $('#rounds')) $('#rounds').value = keepRounds;
    if (fin && isHost()) bindCatEditor();
    app.querySelectorAll('[data-ch]').forEach((b) => {
      b.onclick = async () => {
        try { await api('challenge', { target: b.dataset.t, cat: +b.dataset.c }); }
        catch (e) { $('#err').textContent = e.message; }
      };
    });
    window.scrollTo(0, sy);
    const next = $('#next');
    if (next) next.onclick = async () => { try { await api('next', {}); } catch (e) { $('#err').textContent = e.message; } };
    const again = $('#again');
    if (again) again.onclick = async () => { try { await api('start', { rounds: $('#rounds').value, categories: cleanCfg() }); } catch (e) { $('#err').textContent = e.message; } };
  }

  // ---------- გაშვება ----------
  if (session) { screenKey = 'connecting'; app.innerHTML = '<p class="sub">ვუკავშირდებით…</p>'; connect(); }
  else renderHome();
})();
</script>
</body>
</html>
