<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ფურთი</title>
<style>
:root{--gold:#e8b94a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:15px 'Noto Sans Georgian',system-ui,sans-serif;color:#f6f0dc;background:radial-gradient(ellipse at 50% 40%,#238a56,#0b3a27 78%);overflow-x:hidden}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:11px 20px;background:var(--gold);color:#2b1d00;cursor:pointer;box-shadow:0 3px 0 #9a7418}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #9a7418}button:disabled{opacity:.35;cursor:default}
input,select{font:inherit;padding:10px;border-radius:10px;border:0;width:100%}
#ctl{position:fixed;top:8px;right:8px;display:flex;gap:6px;z-index:50}
#ctl button{padding:0;width:38px;height:38px;border-radius:50%;font-size:18px;box-shadow:0 2px 0 #9a7418}
.box{max-width:380px;margin:8vh auto;padding:26px;border-radius:20px;background:#0a2c1de6;display:grid;gap:12px;box-shadow:0 20px 50px #0008}
h1{margin:0;font-size:44px;color:var(--gold);text-align:center}.box p,.box small{margin:0;opacity:.8;text-align:center}details{font-size:13px;opacity:.9}
.game{max-width:1000px;margin:auto;padding:8px;height:100dvh;display:grid;grid-template-rows:auto 1fr auto auto;gap:8px}
.bar{display:flex;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;padding-right:136px;opacity:.92;font-size:14px;align-items:center}
.arena{display:grid;grid-template-columns:minmax(78px,150px) 1fr minmax(78px,150px);grid-template-rows:auto 1fr;grid-template-areas:". top ." "left table right";gap:8px;min-height:0}
.seat{position:relative;padding:8px 12px;border-radius:14px;background:#0005;border:2px solid transparent;display:grid;gap:5px;justify-items:center;text-align:center;transition:background .3s}
.pos-left{grid-area:left;align-self:center}.pos-top{grid-area:top;justify-self:center;min-width:190px}.pos-right{grid-area:right;align-self:center}
.nm{font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backs{display:flex;justify-content:center;min-height:31px;padding-left:10px}
.backs s{width:22px;aspect-ratio:5/7;margin-left:-10px;border-radius:4px;border:2px solid #fff;background:repeating-linear-gradient(45deg,#8c1d2b 0 4px,#a82b3b 4px 8px)}
.inf{display:flex;gap:10px;align-items:center;font-size:13px;flex-wrap:wrap;justify-content:center}.inf b{color:var(--gold);font-size:16px}
.pile{width:26px;aspect-ratio:5/7;border-radius:5px;border:2px solid #fff;background:repeating-linear-gradient(45deg,#8c1d2b 0 4px,#a82b3b 4px 8px);display:grid;place-items:center;font:800 12px system-ui;color:#fff;text-shadow:0 1px 2px #000}
.pile.pulse{animation:pp .5s}@keyframes pp{50%{transform:scale(1.5);box-shadow:0 0 14px var(--gold)}}
.dl{position:absolute;top:-11px;right:-11px;width:28px;height:28px;border-radius:50%;background:#fff;color:#111;font:800 15px/28px system-ui;text-align:center;box-shadow:0 2px 5px #0009,inset 0 0 0 3px #ddd,inset 0 0 0 4px #999}
@keyframes pulse{50%{box-shadow:0 0 28px 6px #e8b94acc}}
.seat.turn{border-color:var(--gold);background:#4a3a0acc;animation:pulse 1.2s ease-in-out infinite}
.seat.turn .nm::before{content:'▶ ';color:var(--gold)}
.th{color:#ffe9a8;font-weight:700;animation:bl 1.2s infinite}.seat.me .th{font-size:14px}@keyframes bl{50%{opacity:.4}}
.table{grid-area:table;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:center;padding:18px;border-radius:26px;background:#0003;box-shadow:inset 0 0 30px #0006;min-height:150px;border:2px solid transparent;transition:border-color .3s}
.table.mine{border-color:#e8b94a66}.table .c{--w:min(84px,13vw,11vh)}
.msg{text-align:center;min-height:24px;font-size:16px;font-weight:700;color:#ffe9a8}
.me{grid-auto-flow:column;justify-self:center;align-items:center;gap:16px}
.hand{display:flex;gap:10px;justify-content:center;padding-top:14px}.hand .c{--w:min(104px,20vw,15vh)}
.btns{display:flex;gap:12px;justify-content:center;margin-top:8px}
/* ბანქო */
.c{--w:84px;width:var(--w);aspect-ratio:5/7;font-size:var(--w);border-radius:.08em;background:linear-gradient(#fff,#f3eedd);color:#1b1b1b;position:relative;box-shadow:0 3px 8px #0007;cursor:pointer;transition:transform .15s;user-select:none;flex:none}
.c.red{color:#c4162a}.c.hd{visibility:hidden}
.c .k{position:absolute;left:.04em;top:.04em;width:.2em;display:grid;justify-items:center;gap:.01em;font:700 .2em/1 Georgia,serif;letter-spacing:-.04em}
.c .k svg{width:.15em;height:.15em}.c .k.z{left:auto;top:auto;right:.04em;bottom:.04em;transform:rotate(180deg)}
.pp{position:absolute;width:.21em;height:.21em;transform:translate(-50%,-50%)}.pp.r{transform:translate(-50%,-50%) rotate(180deg)}.pp.big{width:.5em;height:.5em}
.fc{position:absolute;inset:7% 27%;border:.012em solid currentColor;border-radius:.04em;background:linear-gradient(160deg,#fff8de,#ecd387);display:flex;flex-direction:column;align-items:center;justify-content:space-around}
.fc span{font:700 .34em/1 Georgia,serif}.fc svg{width:.13em;height:.13em}.fc svg.r{transform:rotate(180deg)}
.c:hover{transform:translateY(-5px)}.c.sel{transform:translateY(-14px);outline:3px solid var(--gold)}.c.on{outline:3px solid #4fd6ff;transform:translateY(-6px)}.c.hint{outline:2px dashed #fffa}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}.gh{transition:none!important;pointer-events:none;cursor:default}.gh:hover{transform:none}
.gh.cap{outline:3px solid #4fd6ff;box-shadow:0 0 22px #4fd6ff}
.ov{position:fixed;inset:0;background:#000a;display:flex;overflow:auto;padding:12px;z-index:40}.ov .box{margin:auto;width:100%;max-width:470px}
.ov.late{animation:ovin .5s var(--dl) backwards}@keyframes ovin{from{opacity:0}}
.prog{display:flex;gap:7px;align-items:center}.dots{display:inline-flex;gap:4px}.dots i{width:11px;height:11px;border-radius:50%;border:2px solid #e8b94a88}.dots i.d{background:var(--gold);border-color:var(--gold)}.dots i.a{border-color:var(--gold);background:#e8b94a55}
.dk{display:flex;gap:6px;align-items:center}.dk s{width:15px;aspect-ratio:5/7;border-radius:3px;border:2px solid #fff;background:repeating-linear-gradient(45deg,#8c1d2b 0 4px,#a82b3b 4px 8px)}
.ban{position:fixed;left:50%;top:36%;transform:translate(-50%,-50%);z-index:35;pointer-events:none;padding:14px 26px;border-radius:18px;background:#0a2c1def;border:2px solid var(--gold);text-align:center;box-shadow:0 14px 40px #000a;max-width:92vw}
.ban b{display:block;font-size:24px;color:var(--gold)}.ban span{font-size:14px;opacity:.9}
.sm{border-collapse:collapse;width:100%;font-size:14px}.sm th{font-weight:600;font-size:12px;opacity:.7;padding:2px 4px}.sm td{padding:8px 4px;text-align:center;border-top:1px solid #fff2}
.sm td:first-child{text-align:left;max-width:96px}.sm .g{color:var(--gold);font-weight:700}.sm sup{font-size:10px;margin-left:2px}.sm tr.win td{background:#e8b94a22}.rd{color:#ff7b8a}
.box p.note{font-size:13px;opacity:.9}

.hand .c{touch-action:none;cursor:grab}.gh.dg{transform:scale(1.06);box-shadow:0 16px 34px #000b;cursor:grabbing}
.table.over{border-color:var(--gold);background:#0006}
.dlab{position:absolute;z-index:6;padding:4px 11px;border-radius:10px;background:#0a2c1def;border:1px solid var(--gold);font-weight:700;font-size:13px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%);color:#ffe9a8}
.sec{background:#ffffff26;color:#f6f0dc;box-shadow:0 3px 0 #0006}.rl{display:grid;gap:8px}
@media(max-width:520px){.pos-top{min-width:150px}.seat{padding:6px}.backs s{width:16px;margin-left:-8px}}
</style></head><body>

<div id="ctl"><button id="bl" onclick="leave()" title="გასვლა" style="display:none">🚪</button><button id="bm" onclick="mute()" title="ხმა">🔊</button><button id="bf" onclick="fs()" title="სრულ ეკრანზე">⛶</button></div>

<script>
const $=s=>document.querySelector(s),A=$('#app'),FX=$('#fx'),SY='♠♥♦♣',RN=r=>({1:'A',11:'J',12:'Q',13:'K'})[r]||r,lan=location.protocol.startsWith('http');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
let G=null,net=null,V=null,sel=null,grp=[],name='',seats={},lob=[],tm,code,seen=0,evc=0,seenA=0,anc=0,DG=null,DR=null,noClick=0;const hid=new Set();
const BN=['','ბოტი ნიკა','ბოტი ანი','ბოტი გიო'],key=a=>a.map(x=>x.id).sort().join(),BOT_MS=2800;
function mk(){let d=[];for(let s=0;s<4;s++)for(let r=1;r<=13;r++)d.push({r,s,id:s*13+r});for(let i=51;i>0;i--){let j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return d}
/* ---- ხმა / ეკრანი ---- */
let AC,muted=false;try{muted=localStorage.furtMute=='1'}catch(e){}
const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,t,d,type,v,f2){const a=ac(),o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t;o.type=type||'sine';o.frequency.setValueAtTime(f,T);if(f2)o.frequency.exponentialRampToValueAtTime(f2,T+d);g.gain.setValueAtTime(v||.15,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g).connect(a.destination);o.start(T);o.stop(T+d)}
function noise(t,d,v,fr){const a=ac(),n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);
 const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();f.type='bandpass';f.frequency.value=fr||2200;g.gain.value=v||.4;s.buffer=b;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+t)}
const SND={put(){noise(0,.09,.7,1800);tone(180,0,.08,'sine',.12,90)},take(){noise(0,.08,.5,2600);tone(520,.02,.12,'triangle',.12);tone(780,.1,.16,'triangle',.12)},
 deal(){for(let i=0;i<4;i++)noise(i*.09,.06,.5,3000)},ping(){tone(880,0,.14,'sine',.12);tone(1320,.1,.22,'sine',.1)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3,'triangle',.14))},lose(){[392,330,262].forEach((f,i)=>tone(f,i*.18,.35,'sawtooth',.06))}};
const snd=n=>{if(muted)return;try{ac().resume();SND[n]()}catch(e){}};
function mute(){muted=!muted;try{localStorage.furtMute=muted?'1':'0'}catch(e){}ctl();snd('ping')}
const FSE=()=>document.fullscreenElement||document.webkitFullscreenElement,canFS=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;
function fs(){const d=document,e=d.documentElement;try{FSE()?(d.exitFullscreen||d.webkitExitFullscreen).call(d):(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(x){}}
function ctl(){$('#bm').textContent=muted?'🔇':'🔊';$('#bf').textContent=FSE()?'🗗':'⛶';$('#bf').style.display=canFS?'':'none'}
document.addEventListener('fullscreenchange',ctl);document.addEventListener('webkitfullscreenchange',ctl);ctl();
/* ---- წესები ---- */
function groups(c,t){if(c.r==11){let g=t.filter(x=>x.r<12);return g.length?[g]:[]}
 if(c.r>11)return t.filter(x=>x.r==c.r).map(x=>[x]);
 let nums=t.filter(x=>x.r<=10),need=11-c.r,n=nums.length,out=[];
 for(let m=1;m<1<<n;m++){let s=0,g=[];for(let i=0;i<n;i++)if(m>>i&1){s+=nums[i].r;g.push(nums[i])}if(s==need)out.push(g)}return out}
function newDeal(){G.deck=mk();G.hands=[...Array(G.n)].map(()=>G.deck.splice(0,4));G.table=G.deck.splice(0,4);G.caps=[...Array(G.n)].map(()=>[]);G.last=-1;G.deal=1;G.tot=12/G.n;G.turn=(G.dealer+1)%G.n}
function tally(){const cnt=G.caps.map(c=>c.length),clb=G.caps.map(c=>c.filter(x=>x.s==3).length),
 top=v=>{const m=Math.max(...v),k=v.filter(x=>x==m).length;return{m,i:m>0&&k==1?v.indexOf(m):-1,tie:m>0&&k>1}},a=top(cnt),b=top(clb);
 return G.caps.map((c,i)=>{const d=c.some(x=>x.r==10&&x.s==2),t=c.some(x=>x.r==2&&x.s==3);
  return{cards:cnt[i],clubs:clb[i],mc:a.i==i,mk:b.i==i,tc:a.tie&&cnt[i]==a.m,tk:b.tie&&clb[i]==b.m,d10:d,c2:t,pts:(a.i==i?2:0)+(b.i==i?1:0)+(d?1:0)+(t?1:0)}})}
function endRound(){const left=G.table;if(G.last>=0)G.caps[G.last].push(...left);G.table=[];
 const rows=tally();rows.forEach((r,i)=>G.scores[i]+=r.pts);
 const m=Math.max(...G.scores),fin=m>=G.target,uniq=G.scores.filter(x=>x==m).length==1;
 if(fin&&uniq)G.over=G.scores.indexOf(m);
 G.phase='sum';G.sum={round:G.round,rows,left:G.last>=0?left:[],p:G.last,tie:fin&&!uniq,next:(G.dealer+1)%G.n};
 G.msg='ხელი '+G.round+' დასრულდა: '+rows.map((r,i)=>G.names[i]+' +'+r.pts).join(' · ')}
function nextRound(){if(!G||G.phase!='sum'||G.over!==null)return;G.dealer=(G.dealer+1)%G.n;G.round++;newDeal();G.phase='play';G.sum=null;
 G.ann={n:++anc,k:'round'};G.msg='ხელი '+G.round+' დაიწყო · დილერი: '+G.names[G.dealer];pump()}
function act(i,cid,ids){if(G.over!==null||G.phase!='play'||G.turn!=i)return;const c=G.hands[i].find(x=>x.id==cid);if(!c)return;
 const g=ids.map(id=>G.table.find(x=>x.id==id));if(g.includes(undefined))return;
 const gs=groups(c,G.table);
 if(g.length&&!gs.some(a=>key(a)==key(g)))return;
 if(!g.length&&c.r==11&&gs.length)return; // ვალეტს მიყავს, როცა შეუძლია
 G.hands[i]=G.hands[i].filter(x=>x!=c);const cs=RN(c.r)+SY[c.s];
 if(g.length){G.table=G.table.filter(x=>!g.includes(x));G.caps[i].push(c,...g);G.last=i;G.ev={n:++evc,p:i,c,g,k:1};G.msg=`${G.names[i]}: ${cs} — აიღო ${g.length+1} ბანქო`+(G.table.length?'':' · მაგიდა გასუფთავდა!')}
 else{G.table.push(c);G.ev={n:++evc,p:i,c,g:[],k:0};G.msg=`${G.names[i]} დადო ${cs}`}
 if(G.hands.every(h=>!h.length)){if(G.deck.length){G.hands=G.hands.map(()=>G.deck.splice(0,4));G.deal++;G.ann={n:++anc,k:'deal'};G.msg+=' · დარიგება '+G.deal+'/'+G.tot}else return endRound()}
 G.turn=(G.turn+1)%G.n}
/* ---- ბოტი ---- */
function risk(t){let m=1;for(const x of t)if(x.r<=10)m|=m<<x.r;let k=0;for(let s=1;s<=10;s++)if(m>>s&1)k++;return k+(t.filter(x=>x.r<12).length>2?1.5:0)}
const spec=x=>(x.s==3?1.5:0)+(x.r==10&&x.s==2?5:0)+(x.r==2&&x.s==3?4:0);
function bot(i){let best=null,t=G.table;const cand=(v,c,g)=>{v+=Math.random()*.4;if(!best||v>best.v)best={v,c,g}};
 for(const c of G.hands[i]){const gs=groups(c,t);
  for(const g of gs){const all=[c,...g],rest=t.filter(x=>!g.includes(x));
   let v=all.reduce((a,x)=>a+1+spec(x),0)-risk(rest)*.25+(rest.length?0:1.5);if(c.r==11&&g.length<3)v-=2.5;cand(v,c,g)}
  if(!(c.r==11&&gs.length))cand(-risk([...t,c])*.3-spec(c)*.9-(c.r>11&&t.some(x=>x.r==c.r)?3:0)-.2*c.r*(c.r<11?0:1),c,[])}
 act(i,best.c.id,best.g.map(x=>x.id))}
/* ---- ნახვა და ქსელი ---- */
const view=i=>({n:G.n,you:i,names:G.names,turn:G.turn,table:G.table,hand:G.hands[i],cnt:G.hands.map(h=>h.length),cap:G.caps.map(c=>c.length),clubs:G.caps.map(c=>c.filter(x=>x.s==3).length),sc:G.scores,deck:G.deck.length,msg:G.msg,over:G.over,target:G.target,dealer:G.dealer,ev:G.ev,round:G.round,deal:G.deal,tot:G.tot,phase:G.phase,sum:G.sum,ann:G.ann});
function tx(to,m){fetch(`/tx?room=${net.room}&id=${net.id}`,{method:'POST',body:JSON.stringify({to,m})}).catch(()=>{})}
function conn(room,host){const id=Math.random().toString(36).slice(2);net={id,room,host};
 const es=new EventSource(`/ev?room=${encodeURIComponent(room)}&id=${id}${host?'&host=1':''}`);net.es=es;
 es.onmessage=e=>{if(!net||net.es!==es)return;const d=JSON.parse(e.data),m=d.m;host?onHost(d.from,m):onCli(m)}}
function onHost(from,m){
 if(m.t=='ok')pub();
 if(m.t=='err'){leave(1);alert(m.x)}
 if(m.t=='join'){if(seats[from]!=null){tx(from,{t:'seat',you:seats[from]});return G?draw():lobby()}
  if(G)return tx(from,{t:'err',x:'თამაში უკვე დაწყებულია'});const i=lob.findIndex((x,k)=>k&&x===null);
  if(i<0)return tx(from,{t:'err',x:'ოთახი სავსეა'});seats[from]=i;lob[i]=m.name;tx(from,{t:'seat',you:i});lobby()}
 if(m.t=='mv'&&G&&seats[from]!=null){act(seats[from],m.c,m.g);pump()}
 if(m.t=='bye'){const i=seats[from];delete seats[from];if(i==null)return;if(G){G.kind[i]='bot';G.names[i]+=' (ბოტი)';pump()}else{lob[i]=null;lobby()}}}
function onCli(m){if(m.t=='ok')tx('h',{t:'join',name});
 if(m.t=='lobby')waitView(m.names);if(m.t=='st'){G=1;render(m.v)}if(m.t=='err'){leave(1);alert(m.x)}}
/* ---- მენიუ ---- */
function menu(){$('#bl').style.display='none';A.innerHTML=`<div class=box><h1>ფურთი</h1><p>თერთმეტობანა · ქართული კარტის თამაში</p>
<input id=nm placeholder="თქვენი სახელი" maxlength=14 value="${esc(name)}"><label>მოთამაშეების რაოდენობა<select id=np><option>2<option>3<option selected>4</select></label>
<button onclick=solo()>ბოტებთან თამაში</button><button onclick=hostLobby() ${lan?'':'disabled'}>LAN ოთახის შექმნა</button>

 if(x<tb.left-20||x>tb.right+20||y<tb.top-20||y>tb.bottom+20)return{m:'none'};
 const el=document.elementsFromPoint(x,y).find(e=>e.matches&&e.matches('.table .c')),t=el&&+el.dataset.id;
 if(c.r==11)return gs.length?{m:'take',g:gs[0].map(z=>z.id)}:{m:'put'};
 if(t){const m=gs.filter(g=>g.some(z=>z.id==t));return m.length==1?{m:'take',g:m[0].map(z=>z.id)}:m.length?{m:'amb',t}:{m:'none'}}
 return{m:'put'}}
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest&&e.target.closest('.hand .c');
 if(!el||!V||V.turn!=V.you||V.phase!='play'||V.over!==null||(e.pointerType=='mouse'&&e.button))return;
 const c=V.hand.find(x=>x.id==el.dataset.id);if(c)DG={id:c.id,c,el,x0:e.clientX,y0:e.clientY,on:0,pid:e.pointerId}});
function dragStart(){const d=DG,r=d.el.getBoundingClientRect();d.on=1;d.ox=d.x0-r.left;d.oy=d.y0-r.top;d.r=r;DR=null;
 sel=d.id;grp=d.c.r==11?V.table.filter(x=>x.r<12).map(x=>x.id):[];d.hint=new Set(groups(d.c,V.table).flat().map(x=>x.id));
 d.gh=ghost(d.c,r.width,r.left,r.top,'dg',5);d.el.style.opacity='.25';
 d.lb=document.createElement('div');d.lb.className='dlab';d.lb.style.display='none';FX.appendChild(d.lb);
 A.querySelectorAll('.table .c').forEach(t=>{t.classList.remove('on');t.classList.toggle('hint',d.hint.has(+t.dataset.id))})}
function dragMove(e){const d=DG,gl=e.clientX-d.ox,gt=e.clientY-d.oy;d.gh.style.left=gl+'px';d.gh.style.top=gt+'px';
 const p=plan(d.c,e.clientX,e.clientY),on=new Set(p.m=='take'?p.g:p.m=='amb'?[p.t]:[]),tb=A.querySelector('.table');
 A.querySelectorAll('.table .c').forEach(t=>{const id=+t.dataset.id;t.classList.toggle('on',on.has(id));t.classList.toggle('hint',d.hint.has(id)&&!on.has(id))});
 tb.classList.toggle('over',p.m=='put');
 const L=d.lb;L.style.display=p.m=='none'?'none':'';L.textContent=p.m=='take'?'აიღე '+(p.g.length+1)+' ბანქო':p.m=='put'?'დადე':'აირჩიე ბანქოები';
 L.style.left=e.clientX+'px';L.style.top=(gt-8)+'px'}
function dragEnd(e,cancel){const d=DG;DG=null;if(!d||!d.on)return;noClick=Date.now()+350;
 A.querySelector('.table')?.classList.remove('over');d.lb.remove();
 const p=cancel?{m:'none'}:plan(d.c,e.clientX,e.clientY),r=d.gh.getBoundingClientRect();
 if(p.m=='take'||p.m=='put'){d.gh.remove();DR={id:d.id,rect:{left:r.left,top:r.top,width:r.width,height:r.height}};submit(d.id,p.m=='take'?p.g:[]);
  setTimeout(()=>{if(DR&&DR.id==d.id){DR=null;V&&render(V)}},1500);return}
 if(p.m=='amb'){d.gh.remove();sel=d.id;grp=[p.t];return render(V)}
 let done=0;const fin=()=>{if(done++)return;d.gh.remove();V&&render(V)};
 const a=d.gh.animate([{transform:'scale(1.06)'},{transform:`translate(${d.r.left-r.left}px,${d.r.top-r.top}px)`}],{duration:220,easing:'ease-out'});
 a.onfinish=fin;setTimeout(fin,400)}
document.addEventListener('pointermove',e=>{if(!DG||e.pointerId!=DG.pid)return;
 if(!DG.on){if(Math.hypot(e.clientX-DG.x0,e.clientY-DG.y0)<8)return;dragStart()}dragMove(e)});
document.addEventListener('pointerup',e=>{if(DG&&e.pointerId==DG.pid)dragEnd(e)});
document.addEventListener('pointercancel',e=>{if(DG&&e.pointerId==DG.pid)dragEnd(e,1)});

/* ---- ოთახები და გასვლა ---- */
function pub(){if(!net||!net.host)return;fetch(`/info?room=${encodeURIComponent(net.room)}&id=${net.id}`,{method:'POST',body:JSON.stringify({name:lob[0]||name,n:lob.length,c:lob.filter(x=>x!==null).length,st:G?1:0})}).catch(()=>{})}
function rooms(){if(!lan||!$('#rl'))return;fetch('/rooms',{cache:'no-store'}).then(r=>r.json()).then(l=>{const e=$('#rl');if(!e)return;
 e.innerHTML=l.length?l.map(x=>`<button data-r="${esc(x.room)}" onclick=joinRoom(this.dataset.r)>${esc(x.host)}-ის ოთახი · ${x.c}/${x.n}</button>`).join(''):'<small>ღია ოთახი ვერ მოიძებნა. შექმენი შენი!</small>'}).catch(()=>{})}
function leave(force){
 if(!force&&G&&!confirm(net?(net.host?'გავიდე? თამაში ყველასთვის დასრულდება.':'გავიდე? შენს ადგილს ბოტი დაიკავებს.'):'გავიდე მენიუში? მიმდინარე თამაში დაიკარგება.'))return;
 clearTimeout(tm);if(net&&net.es)net.es.close();
 net=null;G=null;V=null;sel=null;grp=[];seats={};lob=[];seen=0;seenA=0;DG=null;DR=null;hid.clear();FX.innerHTML='';menu()}
setInterval(rooms,2000);
menu();
</script></body></html>
